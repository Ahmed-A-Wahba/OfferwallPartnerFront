<aside class="fixed inset-y-0 left-0 w-64 bg-white border-r border-[#EEEEF4] flex flex-col justify-between z-30">
  <div class="flex flex-col flex-1 overflow-y-auto">
    <!-- Logo Header -->
    <div class="p-6 pb-8 border-b border-[#EEEEF4]/40">
      <h1 class="font-sora font-extrabold text-2xl tracking-[-0.05em] text-[#7C3AED]">NEXUS</h1>
      <p class="font-inter font-semibold text-[10px] tracking-[0.05em] text-[#64748B] uppercase mt-1">Publisher Portal</p>
    </div>

    <!-- Navigation Links -->
    <nav class="p-4 space-y-1">
      <a routerLink="/dashboard"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="bg-[#7C3AED]/5 text-[#7C3AED] font-bold"
         class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-[#F9FAFB] hover:text-[#151C27] transition-all duration-200">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path>
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/iframe"
         routerLinkActive="bg-[#7C3AED]/5 text-[#7C3AED] font-bold"
         class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-[#F9FAFB] hover:text-[#151C27] transition-all duration-200">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
        </svg>
        <span>iFrame Integration</span>
      </a>

      <!-- Collapsible Reports Link -->
      <div>
        <button (click)="toggleReportsMenu()"
                class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-[#F9FAFB] hover:text-[#151C27] transition-all duration-200 focus:outline-none"
                [ngClass]="currentRoute.includes('reports') ? 'bg-[#7C3AED]/5 text-[#7C3AED]' : ''">
          <div class="flex items-center gap-3">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <span>Reports</span>
          </div>
          <svg class="w-4 h-4 transition-transform duration-200" [ngClass]="isReportsExpanded ? 'rotate-90 text-[#7C3AED]' : 'text-[#64748B]'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>

        <!-- Collapsible Sub-menu -->
        <div *ngIf="isReportsExpanded" class="pl-12 pr-4 py-1 space-y-1">
          <a routerLink="/reports/redemptions"
             routerLinkActive="text-[#7C3AED] font-bold"
             class="block py-2 text-xs font-semibold text-[#4A4455] hover:text-[#151C27] transition-colors duration-200">
            Redemptions
          </a>
        </div>
      </div>

      <a routerLink="/payouts"
         routerLinkActive="bg-[#7C3AED]/5 text-[#7C3AED] font-bold"
         class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-[#F9FAFB] hover:text-[#151C27] transition-all duration-200">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>Payouts</span>
      </a>

      <a routerLink="/settings"
         routerLinkActive="bg-[#7C3AED]/5 text-[#7C3AED] font-bold"
         class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-[#F9FAFB] hover:text-[#151C27] transition-all duration-200">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span>Settings</span>
      </a>

      <a routerLink="/docs"
         routerLinkActive="bg-[#7C3AED]/5 text-[#7C3AED] font-bold"
         class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-[#F9FAFB] hover:text-[#151C27] transition-all duration-200">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <span>API Docs</span>
      </a>
    </nav>
  </div>

  <!-- Bottom Actions -->
  <div class="p-4 border-t border-[#EEEEF4] space-y-1">
    <a href="mailto:support@nexus.com"
       class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-[#F9FAFB] hover:text-[#151C27] transition-all duration-200">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <span>Support</span>
    </a>

    <button (click)="onLogout()"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-[#64748B] hover:bg-red-50 hover:text-red-600 transition-all duration-200 focus:outline-none">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      <span>Logout</span>
    </button>
  </div>
</aside>
